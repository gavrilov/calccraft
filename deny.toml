# cargo-deny's configuration (https://embarkstudios.github.io/cargo-deny/).
#
# `cargo deny check licenses` checks the license of every library in Cargo.lock, for every
# platform CalcCraft builds for, against the allow-list below: permissive open-source
# licenses only, MIT and its relatives. A library under a choice of licenses ("MIT OR
# Apache-2.0", "Apache-2.0 OR GPL-2.0-only") passes when one of them is allowed: we use it
# under that one. CI runs the check for every push and pull request (ci.yml).
#
# Install it with `cargo install cargo-deny --locked`. It doesn't see the fonts in
# assets/fonts, which aren't Rust libraries: assets/fonts/README.md lists their licenses.

[graph]
# The platforms CalcCraft builds for, so their own libraries (the Windows API, the browser,
# Android's NDK …) are checked too.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
    "aarch64-linux-android",
]

[licenses]
# Permissive licenses: they allow using, changing and shipping the library in CalcCraft, a
# MIT-licensed app, keeping only their notices. Copyleft licenses (GPL, LGPL, AGPL, MPL, EUPL
# …) aren't on the list, so a library that only has one of them fails the check.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
]
# How sure cargo-deny must be when it reads a license from a file instead of Cargo.toml.
confidence-threshold = 0.93
# The list has a few common permissive licenses that no library uses yet.
unused-allowed-license = "allow"

# egui's built-in fonts (Ubuntu Light, Hack, emoji) come under open font licenses, which are
# meant for fonts: allowed for this library only.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# CalcCraft's own crates aren't published (`publish = false`); they are MIT, see LICENSE.
[licenses.private]
ignore = true
