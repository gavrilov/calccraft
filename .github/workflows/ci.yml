name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    # The app targets Windows (DWM title bar tint, Segoe fonts, the share sheet), and the
    # releases are built for Linux and macOS too, so CI checks all three.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Stable must be at least 1.95, the crate's rust-version.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe's build dependencies on Linux (see egui's README).
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  licenses:
    name: licenses (cargo-deny)
    # Every library in Cargo.lock must have a license from deny.toml's allow-list: permissive
    # open-source licenses such as MIT, Apache-2.0 and BSD. A new dependency under a copyleft
    # license (GPL, LGPL, MPL …) fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  web:
    name: web build (wasm32)
    # The web version (.github/workflows/pages.yml deploys it) builds from the same code, so
    # every push and pull request checks that it still compiles for the browser. Nothing is
    # deployed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # A prebuilt Trunk; it fetches the wasm-bindgen and wasm-opt it needs itself.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build the web version
        run: trunk build --release

  android:
    name: Android build (arm64)
    # The Android app (android/README.md) builds from the same code, so every push and pull
    # request checks it and builds an APK, signed with a debug key, which the run keeps as an
    # artifact for `adb install`.
    runs-on: ubuntu-latest
    env:
      NDK: 29.0.14206865
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The runner has the Android SDK and a JDK; these are the packages build-apk.ps1 uses.
      - name: Install the Android SDK packages
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK" > /dev/null

      - name: Clippy (Android)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK" cargo ndk -t arm64-v8a -P 24 clippy --all-targets -- -D warnings

      - name: Build the APK
        shell: pwsh
        run: android/build-apk.ps1 -Ndk $env:NDK

      - uses: actions/upload-artifact@v4
        with:
          name: CalcCraft-android-arm64
          path: target/android/*.apk
          if-no-files-found: error
