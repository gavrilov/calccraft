name: Web

# Builds the web version (index.html, Trunk) and deploys it to GitHub Pages, at
# https://gavrilov.github.io/calccraft/. It runs after every successful release (release.yml),
# so the site matches the latest desktop release, and on demand from the Actions tab (from main).
#
# After a release it builds the release's commit, but the run itself is on the default branch,
# as every workflow_run is: the github-pages environment lets only the default branch deploy,
# so a run on the tag would be rejected ("Tag … is not allowed to deploy to github-pages").
#
# Once, in the repository's settings: Pages → Build and deployment → Source: GitHub Actions.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy to Pages
  id-token: write # prove that the deployment comes from this workflow

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the web version
    # Not after a release that failed: the site waits for the desktop builds.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The released commit after a release, else the commit the run is on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      # A prebuilt Trunk; it fetches the wasm-bindgen and wasm-opt it needs itself.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # The site lives under /<repository>/, so every URL in the page starts there.
      - name: Build
        run: trunk build --release --public-url "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
